<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=https://thoughtful-coding.github.io/" />
    <title>Redirecting...</title>
    <style>
      body {
        font-family: system-ui, -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f5f5f5;
      }
      .redirect-message {
        text-align: center;
        padding: 2rem;
      }
      a {
        color: #4b8bbe;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
    </style>
    <script>
      // Immediate redirect
      window.location.href = "https://thoughtful-coding.github.io/";
    </script>
  </head>
  <body>
    <div class="redirect-message">
      <h1>Redirecting...</h1>
      <p>
        This site has moved to
        <a href="https://thoughtful-coding.github.io/">thoughtful-coding.github.io</a>
      </p>
      <p>
        If you are not redirected automatically,
        <a href="https://thoughtful-coding.github.io/">click here</a>.
      </p>
    </div>
  </body>
</html>
